name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          # The repository has no root go.sum (no dependencies), so point the
          # cache at the modules' go.mod files instead.
          cache-dependency-path: |
            emulator/go.mod
            bridge/go.mod

      - name: gofmt
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unformatted="$(gofmt -l emulator bridge)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./emulator/... ./bridge/...

      - name: go build
        run: go build ./emulator/... ./bridge/...

      - name: go test
        run: go test ./emulator/... ./bridge/...

      # The Makefile is the documented entry point, so it is exercised here (the
      # runner has GNU make; a Windows shell uses tools\build.ps1 instead).
      - name: make build
        if: runner.os == 'Linux'
        run: |
          make build
          ./bin/x32reaper -version
          ./bin/x32emu -version
          ./bin/x32bridge -version
          ./bin/x32listen -version
          ./bin/x32probe -version

      - name: make test
        if: runner.os == 'Linux'
        run: make test

  # Reuses the release configuration (goreleaser) so that what release.yml does on
  # a tag is exercised on every push, and every run leaves downloadable archives.
  snapshot:
    name: snapshot archives
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache-dependency-path: |
            emulator/go.mod
            bridge/go.mod

      - name: Run GoReleaser (snapshot)
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload archives
        uses: actions/upload-artifact@v7
        with:
          name: x32-reaper-bridge-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 14
